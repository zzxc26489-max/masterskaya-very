<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жители — Мастерская Веры</title><link rel="stylesheet" href="assets/css/styles.css"></head><body data-world-theme="folklore"><main class="section"><p class="eyebrow">Архив встреч</p><h1>Жители Мастерской</h1><p>Каждый обрёл имя, характер и собственную дорогу к Хранителю.</p><div class="resident-filters" role="toolbar" aria-label="Фильтр наличия"><button class="btn" data-filter="all">Все Жители</button><button class="ghost-btn" data-filter="available">В наличии</button><button class="ghost-btn" data-filter="madeToOrder">Можно создать похожего</button><button class="ghost-btn" data-filter="reserved">Зарезервированы</button><button class="ghost-btn" data-filter="adopted">Нашли Хранителя</button></div><div class="resident-grid" id="residentGrid"></div><p id="residentEmpty" hidden>Сейчас в этой части Мастерской тихо. Новые Жители ещё готовятся к встрече.</p></main><script src="assets/data/residents.js"></script><script>const grid=document.querySelector('#residentGrid'),empty=document.querySelector('#residentEmpty');function render(f='all'){const rs=RESIDENTS.filter(r=>f==='all'||r.availabilityStatus===f);grid.innerHTML=rs.map(r=>`<article class="card" data-world-theme="${r.worldTheme}"><img src="${r.mainImage}" alt="${r.name}" loading="lazy"><div class="card-body"><p class="eyebrow">${r.collection}</p><h2>${r.name}</h2><p>${r.shortDescription}</p><span class="availability">${r.availabilityLabel}</span><div><a class="ghost-btn" href="resident-${r.slug}.html">Открыть Жителя</a> <a class="btn" href="resident-birth.html?preset=${r.id}">Создать похожего Жителя</a></div></div></article>`).join('');empty.hidden=rs.length>0}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>render(b.dataset.filter));render();</script></body></html>
